name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        build_type: [Debug, Release]
        shared: [OFF, ON]
        include:
          - os: ubuntu-latest
            cxx: g++
          - os: macos-latest
            cxx: clang++
          - os: windows-latest
            cxx: cl

    steps:
      - uses: actions/checkout@v7

      - name: Setup MSVC dev cmd
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE='${{ matrix.build_type }}' \
            -DCMAKE_CXX_COMPILER='${{ matrix.cxx }}' \
            -DBUILD_SHARED_LIBS='${{ matrix.shared }}'

      - name: Build
        shell: bash
        run: cmake --build build --parallel

      - name: Test
        shell: bash
        run: ctest --test-dir build --output-on-failure

      # CTest discards partial output of timed-out tests, so a hang leaves no
      # trace. Run the offender directly, capture its live process state and a
      # minidump after 45s, then unwind every thread's stack with cdb.
      - name: Diagnose hung tests
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "build\completion_coverage_test.exe"
          if (-not (Test-Path $exe)) { $exe = "build\completion_coverage_test" }
          $p = Start-Process -FilePath $exe -RedirectStandardOutput diag_completion.log -RedirectStandardError diag_completion.err -PassThru
          Start-Sleep -Seconds 45
          try {
            $proc = Get-Process -Id $p.Id -ErrorAction Stop
            "alive=yes cpu=$([math]::Round($proc.CPU,1))s mem=$([math]::Round($proc.WorkingSet64/1MB))MB"
            $proc.Threads | ForEach-Object {
              $top = try { $_.Frames.Count } catch { '?' }
              "thread $($_.Id) state=$($_.ThreadState) wait=$($_.WaitReason) frames=$top"
            }
            $dump = "$env:RUNNER_TEMP\hang.dmp"
            rundll32 comsvcs.dll,MiniDump $($p.Id) $dump full 2>$null
            if (Test-Path $dump) { "dump: $([math]::Round((Get-Item $dump).Length/1MB))MB -> $dump" }
            $cdb = "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64\cdb.exe"
            if ((Test-Path $cdb) -and (Test-Path $dump)) {
              & $cdb -z $dump -c "~*kv 40; qd"
            } else { "cdb present: $(Test-Path $cdb)" }
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          } catch { "process exited early: $_" }
          "--- stdout ($((Get-Item diag_completion.log).Length) bytes) ---"
          Get-Content diag_completion.log -Tail 20
          "--- stderr ($((Get-Item diag_completion.err).Length) bytes) ---"
          Get-Content diag_completion.err -Tail 20

  coverage:
    name: Coverage (Codecov)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Install lcov
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov

      - name: Configure (coverage)
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCLASP_BUILD_EXAMPLES=ON \
            -DCLASP_ENABLE_COVERAGE=ON

      - name: Build
        shell: bash
        run: cmake --build build --parallel

      - name: Test
        shell: bash
        run: ctest --test-dir build --output-on-failure

      - name: Generate coverage (lcov)
        shell: bash
        run: |
          lcov --capture --directory build --output-file coverage_raw.info \
            --rc branch_coverage=1 \
            --rc geninfo_unexecuted_blocks=1 \
            --ignore-errors mismatch \
            --ignore-errors negative
          lcov --extract coverage_raw.info '*/include/*' '*/src/*' --output-file coverage_filtered.info \
            --rc branch_coverage=1 \
            --ignore-errors unused
          lcov --remove coverage_filtered.info '/usr/*' --output-file coverage_filtered.info \
            --rc branch_coverage=1 \
            --ignore-errors unused
          sed -i 's|/home/runner/work/clasp/clasp/||g' coverage_filtered.info
          # Remove branch data to ensure Codecov uses line coverage
          grep -v '^BRDA:' coverage_filtered.info | grep -v '^BRF:' | grep -v '^BRH:' > coverage.info
          lcov --list coverage.info

      - name: Remove build dir to prevent gcov plugin interference
        shell: bash
        run: rm -rf build

      - name: Upload to Codecov (token)
        if: github.event_name == 'push' && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v5
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: coverage.info
          disable_search: true
          plugins: noop
          fail_ci_if_error: false
          skip_validation: true
          verbose: true

      - name: Upload to Codecov (OIDC)
        if: github.event_name == 'push' && env.CODECOV_TOKEN == ''
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: coverage.info
          disable_search: true
          plugins: noop
          fail_ci_if_error: false
          skip_validation: true
          verbose: true
