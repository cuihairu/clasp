# gcovr configuration (picked up automatically from the project root).
# Lines annotated with LCOV_EXCL_LINE mark compiler-generated exception
# cleanup blocks and unreachable defensive branches that cannot be exercised
# by tests (see comments at each marker).
exclude-lines-by-pattern = LCOV_EXCL
# Exclude the exception edges GCC emits for every `throw` statement. Control
# flow is handed to the unwinder, so these branches can never record a taken
# count; they are compiler-generated, not code the tests could ever exercise.
exclude-throw-branches = yes
