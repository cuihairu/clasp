<text x="744" y="700" class="label" text-anchor="start">generate</text>
<text x="1034" y="700" class="label" text-anchor="start">parse</text>
<text x="40" y="1090" class="small" text-anchor="start">The umbrella header clasp.hpp includes color/command/flag/value; implementation lives in src/{clasp,command,flag,color}.cpp, tests in tests/, examples in examples/.</text>
<text x="40" y="1115" class="small" text-anchor="start">The goal is to align with Cobra v1.x observable behavior rather than replicate its Go API: parsing semantics, help/usage and completion protocol are all behavior-compatible.</text>
