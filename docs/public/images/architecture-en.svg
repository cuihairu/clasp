<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1140" viewBox="0 0 1200 1140" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Clasp · Component Architecture</title>
<desc id="desc">Clasp is a C++17 CLI library aligning with Cobra v1.x observable behavior. The app defines Command and Flag and calls Execute(); clasp.hpp is the public umbrella header. Core layer: Command command tree (subcommands/aliases/hooks/args validators/lifecycle/templates), Parser pflag-style parsing, Flag flag definitions, Value type-safe value parsing. Support layer: Color ANSI themes, Config env + config file merge (flag &gt; env &gt; config &gt; default), Shell completion (bash/zsh/fish/powershell, __complete), detail value parsing and utils. Observable behavior: help/usage/error rendering, completion protocol, compatibility behavior.</desc>
