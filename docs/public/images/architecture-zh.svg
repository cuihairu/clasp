<path d="M290 525 H330" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="command-parser" data-from="command" data-to="parser" d="M290 525 H330" class="edge" style="stroke:#2563eb;stroke-width:2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<path d="M580 525 H620" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="parser-flag" data-from="parser" data-to="flag" d="M580 525 H620" class="edge" style="stroke:#2563eb;stroke-width:2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<path d="M870 525 H910" fill="none" stroke="#f8fafc" stroke-width="9"/>
