<text x="60" y="791" class="body" text-anchor="start">color.cpp · ANSI 主题</text>
<text x="60" y="812" class="small" text-anchor="start">vscode / sublime / iterm2 · --color</text></g>
<g id="config" data-node="config"><rect x="330" y="740" width="250" height="84" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="350" y="768" class="name" text-anchor="start">Config 集成</text>
<text x="350" y="791" class="body" text-anchor="start">env 绑定 + 配置文件合并</text>
<text x="350" y="812" class="small" text-anchor="start">.env/.ini/.json/.toml/.yaml</text></g>
<g id="completion" data-node="completion"><rect x="620" y="740" width="250" height="84" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="640" y="768" class="name" text-anchor="start">Shell 补全</text>
<text x="640" y="791" class="body" text-anchor="start">bash / zsh / fish / powershell</text>
<text x="640" y="812" class="small" text-anchor="start">__complete 指令 · 可配置命令名</text></g>
<g id="detail" data-node="detail"><rect x="910" y="740" width="250" height="84" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="930" y="768" class="name" text-anchor="start">detail / utils</text>
<text x="930" y="791" class="body" text-anchor="start">value_parse.hpp · utils.hpp</text>
<text x="930" y="812" class="small" text-anchor="start">值解析细节 · 工具函数</text></g>

<g id="outputs" data-node="outputs"><rect x="40" y="930" width="1120" height="110" rx="14" fill="#edf5ff" stroke="#93b9e3" stroke-width="1.5"/>
<text x="60" y="964" class="name" text-anchor="start">对外可观察行为（reference/compat）</text>
<text x="60" y="992" class="body" text-anchor="start">help / usage / 错误渲染（可选着色） · 补全协议 · 对齐 Cobra v1.x 的 help/usage、解析语义与 completion 行为</text>
<text x="60" y="1016" class="small" text-anchor="start">解析优先级：flag &gt; env &gt; config &gt; default · 未知配置扩展名拒绝 · TraverseChildren 下子命令发现与可选值分离</text></g>

<text x="320" y="518" class="label" text-anchor="middle">解析</text>
<text x="610" y="518" class="label" text-anchor="middle">定义</text>
<text x="900" y="518" class="label" text-anchor="middle">取值</text>
<text x="164" y="700" class="label" text-anchor="start" style="fill:#c2410c">渲染</text>
<text x="454" y="700" class="label" text-anchor="start" style="fill:#7c3aed">合并</text>
<text x="744" y="700" class="label" text-anchor="start">生成</text>
<text x="1034" y="700" class="label" text-anchor="start">解析</text>
<text x="40" y="1090" class="small" text-anchor="start">单头伞头 clasp.hpp 包含 color/command/flag/value；实现位于 src/{clasp,command,flag,color}.cpp，测试在 tests/，示例在 examples/。</text>
<text x="40" y="1115" class="small" text-anchor="start">目标是对齐 Cobra v1.x 可观察行为而非复制其 Go API：解析语义、help/usage、completion 协议均以行为兼容为准。</text>
</svg>
