<g id="app" data-node="app"><rect x="320" y="120" width="560" height="85" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
<text x="342" y="154" class="name" text-anchor="start">你的 CLI 应用</text>
<text x="342" y="182" class="body" text-anchor="start">定义 Command + Flag · 调用 Execute() 运行命令树</text></g>
<g id="umbrella" data-node="umbrella"><rect x="240" y="270" width="720" height="90" rx="14" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
<text x="262" y="304" class="name" text-anchor="start">clasp.hpp — 公共伞头（umbrella）</text>
<text x="262" y="332" class="body" text-anchor="start">include color/command/flag/value · 版本宏 CLASP_VERSION_MAJOR/MINOR/PATCH</text></g>

<g id="command" data-node="command"><rect x="40" y="430" width="250" height="190" rx="14" fill="#eef8f5" stroke="#86c9b3" stroke-width="1.5"/>
<text x="60" y="464" class="name" text-anchor="start">Command</text>
<text x="60" y="486" class="small" text-anchor="start">command.hpp</text>
<text x="60" y="514" class="body" text-anchor="start">命令树 · 子命令 / aliases</text>
<text x="60" y="538" class="body" text-anchor="start">hooks · args validators</text>
<text x="60" y="562" class="body" text-anchor="start">TraverseChildren</text>
<text x="60" y="586" class="body" text-anchor="start">Execute 生命周期 · 模板</text></g>
<g id="parser" data-node="parser"><rect x="330" y="430" width="250" height="190" rx="14" fill="#eef8f5" stroke="#86c9b3" stroke-width="1.5"/>
<text x="350" y="464" class="name" text-anchor="start">Parser</text>
<text x="350" y="486" class="small" text-anchor="start">parser.hpp</text>
<text x="350" y="514" class="body" text-anchor="start">pflag 风格：--k=v / -k=v</text>
<text x="350" y="538" class="body" text-anchor="start">-abc 短分组 · --no-foo 取反</text>
<text x="350" y="562" class="body" text-anchor="start">重复 flags · NoOptDefVal</text>
<text x="350" y="586" class="body" text-anchor="start">子命令与可选值分离</text></g>
<g id="flag" data-node="flag"><rect x="620" y="430" width="250" height="190" rx="14" fill="#eef8f5" stroke="#86c9b3" stroke-width="1.5"/>
<text x="640" y="464" class="name" text-anchor="start">Flag</text>
<text x="640" y="486" class="small" text-anchor="start">flag.hpp</text>
<text x="640" y="514" class="body" text-anchor="start">持久 / 局部 flags</text>
<text x="640" y="538" class="body" text-anchor="start">required / hidden / deprecated</text>
<text x="640" y="562" class="body" text-anchor="start">分组 · 重复</text>
<text x="640" y="586" class="body" text-anchor="start">FlagValue variant</text></g>
<g id="value" data-node="value"><rect x="910" y="430" width="250" height="190" rx="14" fill="#eef8f5" stroke="#86c9b3" stroke-width="1.5"/>
<text x="930" y="464" class="name" text-anchor="start">Value</text>
<text x="930" y="486" class="small" text-anchor="start">value.hpp</text>
<text x="930" y="514" class="body" text-anchor="start">类型安全取值</text>
<text x="930" y="538" class="body" text-anchor="start">bytes / count / IP / CIDR</text>
<text x="930" y="562" class="body" text-anchor="start">IPNet / IPMask / URL</text>
<text x="930" y="586" class="body" text-anchor="start">自定义类型解析</text></g>

<g id="support-band" data-node="support-band"><rect x="40" y="690" width="1120" height="150" rx="14" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="8 6"/>
<text x="60" y="718" class="layer" text-anchor="start">支撑组件</text></g>
<g id="color" data-node="color"><rect x="40" y="740" width="250" height="84" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
