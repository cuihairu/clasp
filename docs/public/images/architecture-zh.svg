<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1140" viewBox="0 0 1200 1140" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
<title id="title">Clasp · 组件架构</title>
<desc id="desc">Clasp 是 C++17 CLI 库，对齐 Cobra v1.x 可观察行为。应用定义 Command 与 Flag 并调用 Execute()；clasp.hpp 为公共伞头。核心层：Command 命令树（子命令/aliases/hooks/args 校验/生命周期/模板）、Parser pflag 风格解析、Flag 标志定义、Value 类型安全取值。支撑层：Color ANSI 主题、Config env 与配置文件合并（flag &gt; env &gt; config &gt; default）、Shell 补全（bash/zsh/fish/powershell、__complete）、detail 值解析与 utils。对外可观察行为：help/usage/错误渲染、补全协议、兼容行为。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="context-stroke"/></marker></defs>
<style>text{font-family:Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#172b4d}.title{font-size:30px;font-weight:700}.name{font-size:21px;font-weight:700}.body{font-size:15px;fill:#435570}.small{font-size:13px;fill:#52647b}.layer{font-size:18px;font-weight:700;fill:#334155}.label{font-size:14px;fill:#435570;paint-order:stroke;stroke:#f8fafc;stroke-width:5px;stroke-linejoin:round}.edge{fill:none;stroke-linejoin:round}.control{stroke-dasharray:7 5}</style>
<rect width="1200" height="1140" rx="20" fill="#f8fafc"/>
<text x="40" y="48" class="title" text-anchor="start">Clasp · 组件架构</text>
<text x="40" y="80" class="body" text-anchor="start">C++17 CLI 库 · 命令树 + pflag 风格解析 · 对齐 Cobra v1.x 可观察 CLI 行为</text>

